# postgres-build-publish-run.yaml
#
# Start: kubectl create -n tekton -f tekton/runs/postgres-build-publish-run.yaml
# (create statt apply wegen generateName)
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: postgres-build-publish-
spec:
  pipelineRef:
    name: postgres-build-publish-ubi9
  params:
    - name: nexus-url
      value: http://nexus.nexus.svc.cluster.local:8081
    # - name: pg-version
    #   value: "18.6"
    # - name: pg-rpm-release
    #   value: 1PGDG.rhel9.8
    # - name: publish
    #   value: "false"
  timeouts:
    pipeline: 30m
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
    - name: nexus-credentials
      secret:
        secretName: nexus-publish
    # Nur nötig, wenn der Cluster die UBI-Repos nicht erreicht (git-core
    # für den Clone). ConfigMap siehe tekton/readme.md.
    # - name: dnf-repos
    #   configMap:
    #     name: rhel9-dnf-repos
