---
# Sperrt die kompromittierten eMudhra-Intermediates (CVE-2026-111943 /
# CVE-2026-91403, RHSB-2026-012) samt Sectigo-Cross-Signs in allen JDKs
# und JREs unter /usr/java und /opt/local/test/jvm. Trägt die Fingerprints
# in lib/security/blocked.certs
# bzw. (JDK 8, ältere 11er) jre/lib/security/blacklisted.certs ein.
#
#   ansible-playbook -i hosts.ini blocked-certs.yml --check --diff
#   ansible-playbook -i hosts.ini blocked-certs.yml
#   ansible-playbook -i hosts.ini blocked-certs.yml -e emudhra_state=absent
#
# Laufende JVMs lesen die Datei nur einmal, danach neu starten
# (siehe readme.md).
- name: eMudhra-Intermediates in JDK blocked.certs sperren
  hosts: "{{ emudhra_hosts | default('all') }}"
  gather_facts: false
  become: true
  vars:
    emudhra_state: present
    # Fehlt ein Pfad auf einem Host, gibt find nur eine Warnung aus.
    emudhra_java_dirs:
      - /usr/java
      - /opt/local/test/jvm
    emudhra_backup: true
    # Quelle: https://emudhra.we-have-a-problem.com/impacted-intermediates.json
    # Pro Zertifikat der Fingerprint des DER wie ausgestellt, die Variante
    # mit umgeschaltetem NULL-Parameter im signatureAlgorithm und bei
    # ECDSA-Signaturen zusätzlich die malleable Signatur (s -> n-s).
    # Gleiche Menge, die OpenJDKs BlockedCertsConverter erzeugt (48 Zeilen).
