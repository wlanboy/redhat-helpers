      4B2460A466F95FD40113BCDCCA2CEB29B3B093921DE45474DA7DF48874C630B1
      A61FE79B019062DD3C6420BC20EAF64702CC1063C546A084DD0A0BCB915A14A9
      AB7292F82267333031F512379FDBADA949DFA49D3C046CC8FA7F34117C342986
      4DED6F955374E40B8558A611A9719B2AB69AA6852AC50966EDC4B07DE4D4277C
      # EM OV CS CA - G3C (issuer: AAA Certificate Services, serial D6A5EF613B390F32EF9CDF349F772841)
      84112972B8E59D14560AE7E7119654474AAD119990CF3722BFC1E3B91615E1FD
      912A48745BFF2F14D1798B27858613DE1C0EB03C2BDE630AFD0DDD5251E1EBE1
    emudhra_hashes: "{{ emudhra_blocked_certs.splitlines() | select('match', '^[0-9A-F]{64}$') | list }}"

  tasks:
    - name: blocked.certs / blacklisted.certs suchen
      ansible.builtin.find:
        paths: "{{ emudhra_java_dirs }}"
        patterns:
          - blocked.certs
          - blacklisted.certs
        recurse: true
        depth: 5
      register: emudhra_found

    - name: cacerts suchen (JDKs ohne Sperrdatei erkennen)
      ansible.builtin.find:
        paths: "{{ emudhra_java_dirs }}"
        patterns: cacerts
        file_type: any
        recurse: true
        depth: 5
      register: emudhra_cacerts

    - name: Nur Dateien unter lib/security bzw. jre/lib/security verwenden
      ansible.builtin.set_fact:
        emudhra_files: >-
          {{ emudhra_found.files | map(attribute='path')
             | select('search', '/lib/security/(blocked|blacklisted)\.certs$')
             | sort }}

    - name: Gefundene Sperrdateien
      ansible.builtin.debug:
        var: emudhra_files

    - name: JDKs ohne Sperrdatei melden (werden nicht angepasst)
      ansible.builtin.debug:
        msg: "Keine blocked.certs/blacklisted.certs in: {{ emudhra_missing }}"
      vars:
        emudhra_missing: >-
          {{ emudhra_cacerts.files | map(attribute='path') | map('dirname')
             | difference(emudhra_files | map('dirname')) | sort }}
      when: emudhra_missing | length > 0

    - name: Algorithm-Zeile lesen
      ansible.builtin.command:
        argv: [grep, -m1, -E, '^[[:space:]]*Algorithm[[:space:]]*[=:]', "{{ item }}"]
      loop: "{{ emudhra_files }}"
      register: emudhra_algo
      changed_when: false
      failed_when: emudhra_algo.rc > 1
      check_mode: false

    # Die Fingerprints oben sind SHA-256. Bei anderem Algorithmus würden
    # sie nie greifen, dann lieber abbrechen.
    - name: Algorithm muss SHA-256 sein
      ansible.builtin.assert:
        that: item.stdout == '' or item.stdout is search('SHA-256\s*$')
        fail_msg: "{{ item.item }}: unerwartete Zeile '{{ item.stdout }}'"
        quiet: true
      loop: "{{ emudhra_algo.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Algorithm=SHA-256 ergänzen, falls die Zeile fehlt
      ansible.builtin.lineinfile:
        path: "{{ item.item }}"
        line: Algorithm=SHA-256
        insertbefore: BOF
      loop: "{{ emudhra_algo.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - emudhra_state == 'present'
        - item.stdout == ''

    - name: Fingerprints eintragen bzw. entfernen
      ansible.builtin.blockinfile:
        path: "{{ item }}"
        block: "{{ emudhra_blocked_certs }}"
        marker: "# {mark} CVE-2026-111943 eMudhra (ansible)"
        state: "{{ emudhra_state }}"
        backup: "{{ emudhra_backup }}"
      loop: "{{ emudhra_files }}"
      register: emudhra_changed

    - name: Sperrdateien zur Kontrolle lesen
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ emudhra_files }}"
      register: emudhra_content
      when:
        - emudhra_state == 'present'
        - not ansible_check_mode

    - name: Alle Fingerprints müssen enthalten sein
      ansible.builtin.assert:
        that: emudhra_not_found | length == 0
        fail_msg: "{{ item.item }}: fehlt {{ emudhra_not_found }}"
        quiet: true
      vars:
        emudhra_not_found: >-
          {{ emudhra_hashes | difference((item.content | b64decode).splitlines() | map('trim')) }}
      loop: "{{ emudhra_content.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.content is defined

    - name: Laufende Java-Prozesse ermitteln
      ansible.builtin.shell: |
        for p in $(pgrep -x java); do
          printf '%s %s %s\n' "$p" "$(ps -o user= -p "$p")" "$(readlink -f /proc/$p/exe)"
        done
      register: emudhra_procs
      changed_when: false
      check_mode: false
      when: emudhra_changed is changed

    - name: Diese JVMs neu starten, damit die Sperre greift
      ansible.builtin.debug:
        msg: "{{ emudhra_restart if emudhra_restart else 'keine laufenden JVMs aus den geänderten JDKs' }}"
      vars:
        emudhra_homes: >-
          {{ emudhra_changed.results | selectattr('changed') | map(attribute='item')
             | map('regex_replace', '(/jre)?/lib/security/[^/]+$', '') | unique }}
        emudhra_restart: >-
          {{ emudhra_procs.stdout_lines
             | select('search', ' (' ~ (emudhra_homes | map('regex_escape') | join('|')) ~ ')/')
             | list }}
      when: emudhra_changed is changed
