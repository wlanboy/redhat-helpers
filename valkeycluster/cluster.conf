# cluster.conf
#
# Konfiguration für install-valkeycluster.sh und cluster.sh.
# Version, SHA256 und Nexus kommen aus ../valkey/versions.conf.
# Jeder Wert kann per Umgebungsvariable überschrieben werden, z.B.:
#   VALKEY_PORTS="7001 7002 7003" ./install-valkeycluster.sh

# Ports der Instanzen auf DIESER VM. Pro Port eine Instanz und eine Unit
# valkey-cluster@<port>.service. Cluster-Bus = Port + 10000.
: "${VALKEY_PORTS:=7001 7002}"

# Alle Instanzen des Clusters (host:port, alle VMs), für "cluster.sh create".
# Beispiel 3 VMs x 2 Instanzen = 3 Primaries + 3 Replicas:
#   "vm1:7001 vm2:7001 vm3:7001 vm1:7002 vm2:7002 vm3:7002"
# Die ersten N/(REPLICAS+1) Einträge werden Primaries, deshalb zuerst je
# eine Instanz pro VM aufführen.
: "${VALKEY_CLUSTER_NODES:=}"

# Replicas pro Primary
: "${VALKEY_CLUSTER_REPLICAS:=1}"

# Optional: IP, die die Instanzen im Cluster bekanntgeben (bei mehreren
# NICs oder NAT). Leer = Valkey ermittelt sie selbst.
: "${VALKEY_ANNOUNCE_IP:=}"

# Zeit in ms, nach der ein Node als ausgefallen gilt (Failover)
: "${VALKEY_NODE_TIMEOUT:=5000}"
