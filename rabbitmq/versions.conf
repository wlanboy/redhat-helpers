# versions.conf
#
# Gemeinsame Konfiguration für build-erlang.sh und install-rabbitmq.sh.
# Jeder Wert kann per Umgebungsvariable überschrieben werden, z.B.:
#   OTP_VERSION=27.3.4.17 ./build-erlang.sh
#
# Kompatibilität prüfen: https://www.rabbitmq.com/docs/which-erlang
#   RabbitMQ 4.3.6 -> Erlang 27.0 bis 28.x
#   Erlang 28 laut RabbitMQ nur für neue Cluster (Rolling Upgrades mit Khepri),
#   deshalb Default auf dem letzten 27er Patch-Release.

: "${OTP_VERSION:=27.3.4.18}"
: "${RABBITMQ_VERSION:=4.3.6}"

# SHA256 der Upstream-Downloads. Leer = keine Prüfung, das Skript gibt dann
# den berechneten Hash aus, damit er hier eingetragen werden kann.
: "${OTP_SHA256:=}"
: "${RABBITMQ_SHA256:=}"

# Nexus Basis-URL ohne abschließenden Slash
: "${NEXUS_URL:=https://nexus.example.com}"

# Raw-Proxy auf https://github.com/ (siehe requirements.md, Repo 2)
: "${NEXUS_GITHUB_REPO:=github-releases}"

# Raw-Hosted für die selbst gebauten Erlang-Tarballs (siehe requirements.md, Repo 3)
: "${NEXUS_BUILDS_REPO:=rabbitmq-builds}"

# Optional: URL des RabbitMQ Release Signing Keys (über den GitHub-Proxy).
# Leer = keine GPG-Prüfung des RabbitMQ-Tarballs.
: "${RABBITMQ_GPG_KEY_URL:=}"

NEXUS_GITHUB="${NEXUS_URL}/repository/${NEXUS_GITHUB_REPO}"
NEXUS_BUILDS="${NEXUS_URL}/repository/${NEXUS_BUILDS_REPO}"
ARCH="$(uname -m)"
ERLANG_TARBALL="erlang-${OTP_VERSION}-el9-${ARCH}.tar.gz"
