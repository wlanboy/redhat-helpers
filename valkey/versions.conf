# versions.conf
#
# Konfiguration für install-valkey.sh.
# Jeder Wert kann per Umgebungsvariable überschrieben werden, z.B.:
#   VALKEY_VERSION=9.0.6 ./install-valkey.sh
#
# Genutzt wird der fertige Ubuntu-22.04-Build (jammy) von download.valkey.io.
# Läuft auf RHEL 9, braucht nur glibc >= 2.34, OpenSSL 3 und libsystemd.

: "${VALKEY_VERSION:=9.1.2}"

# Upstream-Build, aktuell nur "jammy" auf download.valkey.io
: "${VALKEY_DISTRO:=jammy}"

# SHA256 des Tarballs. Leer = Prüfung gegen die .sha256-Datei aus dem Proxy.
: "${VALKEY_SHA256:=}"

# Nexus Basis-URL ohne abschließenden Slash
: "${NEXUS_URL:=https://nexus.example.com}"

# Raw-Proxy auf https://download.valkey.io/ (siehe readme.md)
: "${NEXUS_VALKEY_REPO:=valkey-releases}"

NEXUS_VALKEY="${NEXUS_URL}/repository/${NEXUS_VALKEY_REPO}"

# download.valkey.io benennt aarch64 als arm64
case "$(uname -m)" in
    x86_64)  VALKEY_ARCH=x86_64 ;;
    aarch64) VALKEY_ARCH=arm64 ;;
    *)       VALKEY_ARCH="$(uname -m)" ;;
esac
VALKEY_NAME="valkey-${VALKEY_VERSION}-${VALKEY_DISTRO}-${VALKEY_ARCH}"
VALKEY_TARBALL="${VALKEY_NAME}.tar.gz"
