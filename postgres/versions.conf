# versions.conf
#
# Gemeinsame Konfiguration für build.sh (Build-VM) und install.sh (Runtime-VM).
# Jeder Wert kann per Umgebungsvariable überschrieben werden, z.B.:
#   PG_VERSION=18.4 PG_RPM_RELEASE=2PGDG.rhel9.8 ./build.sh
#
# Genutzt werden die fertigen RPMs aus dem offiziellen PostgreSQL-Yum-Repo
# (PGDG, download.postgresql.org). Die Build-VM entpackt sie zu einem
# verschiebbaren Tarball, die Runtime-VMs betreiben ihn aus dem
# Home-Verzeichnis.

: "${PG_VERSION:=18.6}"

# Release-Teil des RPM-Dateinamens (nur build.sh). Enthält die
# RHEL-Minor-Version, gegen die PGDG gebaut hat. Nachsehen unter
#   https://download.postgresql.org/pub/repos/yum/<MAJOR>/redhat/rhel-9-x86_64/
: "${PG_RPM_RELEASE:=1PGDG.rhel9.8}"

# RPM-Signatur gegen den PGDG-Key prüfen (j/n, nur build.sh)
: "${PG_GPG_CHECK:=j}"

# Nexus Basis-URL ohne abschließenden Slash
: "${NEXUS_URL:=http://maven.big.lan}"

# Proxy (yum oder raw) auf https://download.postgresql.org/pub/repos/yum/
# (nur build.sh, siehe readme.md)
: "${NEXUS_PGDG_REPO:=pgdg-yum}"

# Raw-Hosted für die Tarballs der Build-VM (siehe readme.md)
: "${NEXUS_BUILDS_REPO:=postgres-builds}"

NEXUS_PGDG="${NEXUS_URL}/repository/${NEXUS_PGDG_REPO}"
NEXUS_BUILDS="${NEXUS_URL}/repository/${NEXUS_BUILDS_REPO}"

PG_MAJOR="${PG_VERSION%%.*}"
PG_ARCH="$(uname -m)"
PG_NAME="postgresql-${PG_VERSION}"
PG_TARBALL="${PG_NAME}-el9-${PG_ARCH}.tar.gz"
PG_RPM_PATH="${PG_MAJOR}/redhat/rhel-9-${PG_ARCH}"
PG_GPG_KEY_PATH="keys/PGDG-RPM-GPG-KEY-RHEL"

# Benötigte Pakete: Client, libpq, Server, contrib (Extensions wie
# pg_stat_statements, postgres_fdw, pgcrypto)
PG_PACKAGES=(
    "postgresql${PG_MAJOR}"
    "postgresql${PG_MAJOR}-libs"
    "postgresql${PG_MAJOR}-server"
    "postgresql${PG_MAJOR}-contrib"
)
